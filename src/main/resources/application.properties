# ===================================================================
# CONFIGURACIÓN GENERAL DEL ENTORNO DE EJECUCIÓN - KINALAPP
# ===================================================================
server.port=8080
# =========================================
# CONFIGURACIÓN MYSQL
# =========================================

# Protocolo JDBC para la persistencia en el servidor MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/kinalapp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=*jeshua1234567
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# =========================================
# JPA / HIBERNATE
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# =========================================
# THYMELEAF
# =========================================
spring.thymeleaf.cache=false
# Parámetros adicionales de serialización y codificación de respuestas
# =========================================
# MOSTRAR ERRORES
# =========================================
server.error.include-message=always
server.error.include-binding-errors=always