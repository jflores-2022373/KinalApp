<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Login | KinalApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-dark d-flex justify-content-center align-items-center"
      style="height: 100vh;">

<div class="card shadow-lg border-0 p-5 rounded-4"
     style="width: 420px;">

    <!-- TITULO -->
    <div class="text-center mb-4">

        <h1 class="fw-bold text-primary">

            KinalApp

        </h1>

        <p class="text-muted">

            Sistema de Gestión Empresarial

        </p>

    </div>

    <!-- FORMULARIO -->
    <form th:action="@{/login}"
          method="post">

        <!-- USUARIO -->
        <div class="mb-3">

            <label class="fw-bold">

                Usuario

            </label>

            <input type="text"
                   name="username"
                   class="form-control form-control-lg"
                   placeholder="Ingrese su usuario"
                   required>

        </div>

        <!-- PASSWORD -->
        <div class="mb-4">

            <label class="fw-bold">

                Contraseña

            </label>

            <input type="password"
                   name="password"
                   class="form-control form-control-lg"
                   placeholder="Ingrese su contraseña"
                   required>

        </div>

        <!-- BOTON -->
        <button class="btn btn-primary w-100 btn-lg fw-bold">

            Ingresar al Sistema

        </button>

        <!-- ERROR -->
        <div th:if="${param.error}"
             class="alert alert-danger mt-3 text-center">

            Usuario o contraseña incorrectos

        </div>

        <!-- LOGOUT -->
        <div th:if="${param.logout}"
             class="alert alert-success mt-3 text-center">

            Sesión cerrada correctamente

        </div>

    </form>

</div>

</body>
</html>
