<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Ventas | KinalApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<!-- NAVBAR -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <div class="card shadow-lg border-0 rounded-4">

        <div class="card-header bg-danger text-white p-4 rounded-top-4">

            <div class="d-flex justify-content-between align-items-center">

                <h2 class="m-0">

                    Lista de Ventas

                </h2>

                <a th:href="@{/ventas/nuevo}"
                   class="btn btn-light fw-bold">

                    + Nueva Venta

                </a>

            </div>

        </div>

        <div class="card-body p-4">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Total</th>
                        <th>Cliente</th>
                        <th>Usuario</th>
                        <th class="text-center">Acciones</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="venta : ${ventas}">

                        <td th:text="${venta.id}"></td>

                        <td th:text="${venta.fechaVenta}"></td>

                        <td th:text="${venta.total}"></td>

                        <td th:text="${venta.cliente.nombre}"></td>

                        <td th:text="${venta.usuario.nombre}"></td>

                        <td class="text-center">

                            <a th:href="@{/ventas/editar/{id}(id=${venta.id})}"
                               class="btn btn-warning btn-sm me-2">

                                Editar

                            </a>

                            <a th:href="@{/ventas/eliminar/{id}(id=${venta.id})}"
                               class="btn btn-danger btn-sm">

                                Eliminar

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
