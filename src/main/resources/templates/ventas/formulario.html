<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Formulario Venta | KinalApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-header bg-danger text-white p-4 rounded-top-4">

                    <h2 class="m-0">

                        Formulario Venta

                    </h2>

                </div>

                <div class="card-body p-4">

                    <form th:action="@{/ventas/guardar}"
                          th:object="${venta}"
                          method="post">

                        <input type="hidden"
                               th:field="*{id}">

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Total de la Venta

                            </label>

                            <input type="number"
                                   step="0.01"
                                   th:field="*{total}"
                                   class="form-control">

                            <div class="text-danger mt-1"
                                 th:if="${#fields.hasErrors('total')}"
                                 th:errors="*{total}">
                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Cliente

                            </label>

                            <select th:field="*{cliente}"
                                    class="form-select">

                                <option th:each="cliente : ${clientes}"
                                        th:value="${cliente.id}"
                                        th:text="${cliente.nombre + ' ' + cliente.apellido}">
                                </option>

                            </select>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Usuario Responsable

                            </label>

                            <select th:field="*{usuario}"
                                    class="form-select">

                                <option th:each="usuario : ${usuarios}"
                                        th:value="${usuario.id}"
                                        th:text="${usuario.nombre}">
                                </option>

                            </select>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a th:href="@{/ventas}"
                               class="btn btn-secondary px-4">

                                Volver

                            </a>

                            <button type="submit"
                                    class="btn btn-success px-4">

                                Guardar Venta

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
