<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard | KinalApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<!-- NAVBAR -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <!-- TITULO -->
    <div class="text-center mb-5">

        <h1 class="fw-bold text-primary display-5">

            Bienvenido a KinalApp

        </h1>

        <p class="text-muted fs-5">

            Panel principal del sistema empresarial

        </p>

    </div>

    <!-- TARJETAS -->
    <div class="row g-4">

        <!-- PRODUCTOS -->
        <div class="col-lg-3 col-md-6">

            <div class="card dashboard-card shadow-lg border-0 rounded-4 text-center p-4 h-100">

                <div class="mb-3">

                    <i class="bi bi-box-seam text-primary fs-1"></i>

                </div>

                <h3 class="text-primary fw-bold">

                    Productos

                </h3>

                <h1 class="fw-bold display-5"
                    th:text="${totalProductos}">

                    0

                </h1>

            </div>

        </div>

        <!-- CLIENTES -->
        <div class="col-lg-3 col-md-6">

            <div class="card dashboard-card shadow-lg border-0 rounded-4 text-center p-4 h-100">

                <div class="mb-3">

                    <i class="bi bi-people-fill text-success fs-1"></i>

                </div>

                <h3 class="text-success fw-bold">

                    Clientes

                </h3>

                <h1 class="fw-bold display-5"
                    th:text="${totalClientes}">

                    0

                </h1>

            </div>

        </div>

        <!-- USUARIOS -->
        <div class="col-lg-3 col-md-6">

            <div class="card dashboard-card shadow-lg border-0 rounded-4 text-center p-4 h-100">

                <div class="mb-3">

                    <i class="bi bi-person-badge-fill text-warning fs-1"></i>

                </div>

                <h3 class="text-warning fw-bold">

                    Usuarios

                </h3>

                <h1 class="fw-bold display-5"
                    th:text="${totalUsuarios}">

                    0

                </h1>

            </div>

        </div>

        <!-- VENTAS -->
        <div class="col-lg-3 col-md-6">

            <div class="card dashboard-card shadow-lg border-0 rounded-4 text-center p-4 h-100">

                <div class="mb-3">

                    <i class="bi bi-cash-stack text-danger fs-1"></i>

                </div>

                <h3 class="text-danger fw-bold">

                    Ventas

                </h3>

                <h1 class="fw-bold display-5"
                    th:text="${totalVentas}">

                    0

                </h1>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</body>

</html>
