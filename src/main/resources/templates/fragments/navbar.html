<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-dark shadow"
     style="background: linear-gradient(90deg, #0d6efd, #212529);">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold fs-3"
           th:href="@{/}">

            KinalApp

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav me-auto gap-2">

                
                <li class="nav-item">

                    <a class="nav-link fw-semibold"
                       th:href="@{/productos}">

                        Productos

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link fw-semibold"
                       th:href="@{/clientes}">

                        Clientes

                    </a>

                </li>

                <li class="nav-item"
                    sec:authorize="hasRole('ADMIN')">

                    <a class="nav-link fw-semibold"
                       th:href="@{/ventas}">

                        Ventas

                    </a>

                </li>

                <li class="nav-item"
                    sec:authorize="hasRole('ADMIN')">

                    <a class="nav-link fw-semibold"
                       th:href="@{/usuarios}">

                        Usuarios

                    </a>

                </li>

                <li class="nav-item"
                    sec:authorize="hasRole('ADMIN')">

                    <a class="nav-link fw-semibold"
                       th:href="@{/detalleventas}">

                        Detalle Venta

                    </a>

                </li>

            </ul>

            <span class="text-white fw-bold me-3">

                Usuario:
                <span sec:authentication="name"></span>

            </span>

            <span class="badge bg-warning text-dark me-3"
                  sec:authorize="hasRole('ADMIN')">

                ADMIN

            </span>

            <span class="badge bg-info text-dark me-3"
                  sec:authorize="hasRole('USER')">

                USER

            </span>

            <form th:action="@{/logout}"
                  method="post">

                <button class="btn btn-danger fw-bold rounded-pill px-4">

                    Cerrar Sesión

                </button>

            </form>

        </div>

    </div>

</nav>

</body>
</html>
