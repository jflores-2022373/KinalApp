<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Formulario Detalle Venta | KinalApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<!-- NAVBAR -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-header bg-dark text-white p-4 rounded-top-4">

                    <h2 class="m-0">

                        Formulario Detalle Venta

                    </h2>

                </div>

                <div class="card-body p-4">

                    <form th:action="@{/detalleventas/guardar}"
                          th:object="${detalleVenta}"
                          method="post">

                        <input type="hidden"
                               th:field="*{id}">

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Venta

                            </label>

                            <select th:field="*{venta}"
                                    class="form-select"
                                    required>

                                <option value="">

                                    Seleccione una venta

                                </option>

                                <option th:each="venta : ${ventas}"
                                        th:value="${venta.id}"
                                        th:text="'Venta #' + ${venta.id}">
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Producto

                            </label>

                            <select th:field="*{producto}"
                                    class="form-select"
                                    required>

                                <option value="">

                                    Seleccione un producto

                                </option>

                                <option th:each="producto : ${productos}"
                                        th:value="${producto.id}"
                                        th:text="${producto.nombre}">
                                </option>

                            </select>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Cantidad

                            </label>

                            <input type="number"
                                   th:field="*{cantidad}"
                                   class="form-control"
                                   placeholder="Ingrese la cantidad"
                                   min="1"
                                   required>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a th:href="@{/detalleventas}"
                               class="btn btn-secondary px-4">

                                Volver

                            </a>

                            <button type="submit"
                                    class="btn btn-success px-4">

                                Guardar Detalle

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
