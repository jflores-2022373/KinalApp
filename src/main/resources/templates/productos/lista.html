<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <title>Productos | KinalApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5 mb-5">

    <div class="card shadow-lg border-0 rounded-4">

        <div class="card-header bg-success text-white p-4">

            <div class="d-flex justify-content-between align-items-center">

                <h2 class="fw-bold m-0">

                    <i class="bi bi-box-seam-fill"></i>
                    Gestión de Productos

                </h2>

                <a th:href="@{/productos/nuevo}"
                   class="btn btn-light fw-bold">

                    <i class="bi bi-plus-circle"></i>
                    Nuevo Producto

                </a>

            </div>

        </div>

        <div class="card-body p-4">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Categoría</th>
                        <th>Estado</th>

                        <th class="text-center"
                            sec:authorize="hasRole('ADMIN')">

                            Acciones

                        </th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="producto : ${productos}">

                        <td th:text="${producto.id}"></td>

                        <td class="fw-bold"
                            th:text="${producto.nombre}"></td>

                        <td>

                            Q <span th:text="${producto.precio}"></span>

                        </td>

                        <td th:text="${producto.stock}"></td>

                        <td>

                            <span class="badge bg-info text-dark"
                                  th:text="${producto.categoria}"></span>

                        </td>

                        <td>

                            <span class="badge bg-success"
                                  th:if="${producto.estado}">

                                Activo

                            </span>

                            <span class="badge bg-danger"
                                  th:unless="${producto.estado}">

                                Inactivo

                            </span>

                        </td>

                        <td class="text-center"
                            sec:authorize="hasRole('ADMIN')">

                            <a th:href="@{/productos/editar/{id}(id=${producto.id})}"
                               class="btn btn-warning btn-sm me-2">

                                <i class="bi bi-pencil-square"></i>

                            </a>

                            <a th:href="@{/productos/eliminar/{id}(id=${producto.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Desea eliminar este producto?')">

                                <i class="bi bi-trash-fill"></i>

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
