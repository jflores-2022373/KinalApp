<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Formulario Producto | KinalApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-header bg-success text-white p-4 rounded-top-4">

                    <h2 class="m-0">

                        Formulario Producto

                    </h2>

                </div>

                <div class="card-body p-4">

                    <form th:action="@{/productos/guardar}"
                          th:object="${producto}"
                          method="post">

                        <input type="hidden"
                               th:field="*{id}">

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Nombre

                            </label>

                            <input type="text"
                                   th:field="*{nombre}"
                                   class="form-control">

                            <div class="text-danger mt-1"
                                 th:if="${#fields.hasErrors('nombre')}"
                                 th:errors="*{nombre}">
                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Descripción

                            </label>

                            <textarea th:field="*{descripcion}"
                                      class="form-control">
                            </textarea>

                            <div class="text-danger mt-1"
                                 th:if="${#fields.hasErrors('descripcion')}"
                                 th:errors="*{descripcion}">
                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-bold">

                                    Precio

                                </label>

                                <input type="number"
                                       step="0.01"
                                       th:field="*{precio}"
                                       class="form-control">

                                <div class="text-danger mt-1"
                                     th:if="${#fields.hasErrors('precio')}"
                                     th:errors="*{precio}">
                                </div>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-bold">

                                    Stock

                                </label>

                                <input type="number"
                                       th:field="*{stock}"
                                       class="form-control">

                                <div class="text-danger mt-1"
                                     th:if="${#fields.hasErrors('stock')}"
                                     th:errors="*{stock}">
                                </div>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Categoría

                            </label>

                            <input type="text"
                                   th:field="*{categoria}"
                                   class="form-control">

                        </div>

                        <div class="d-flex justify-content-between">

                            <a th:href="@{/productos}"
                               class="btn btn-secondary px-4">

                                Volver

                            </a>

                            <button type="submit"
                                    class="btn btn-success px-4">

                                Guardar Producto

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
