<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <title>Clientes | KinalApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5 mb-5">

    <div class="card shadow-lg border-0 rounded-4">

        <div class="card-header bg-primary text-white p-4">

            <div class="d-flex justify-content-between align-items-center">

                <h2 class="fw-bold m-0">

                    <i class="bi bi-people-fill"></i>
                    Gestión de Clientes

                </h2>

                <a th:href="@{/clientes/nuevo}"
                   class="btn btn-light fw-bold">

                    <i class="bi bi-plus-circle"></i>
                    Nuevo Cliente

                </a>

            </div>

        </div>

        <div class="card-body p-4">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>NIT</th>

                        <th class="text-center"
                            sec:authorize="hasRole('ADMIN')">

                            Acciones

                        </th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="cliente : ${clientes}">

                        <td th:text="${cliente.id}"></td>

                        <td class="fw-bold">

                            <span th:text="${cliente.nombre}"></span>
                            <span th:text="${cliente.apellido}"></span>

                        </td>

                        <td th:text="${cliente.correo}"></td>

                        <td th:text="${cliente.telefono}"></td>

                        <td>

                            <span class="badge bg-secondary"
                                  th:text="${cliente.nit}"></span>

                        </td>

                        <td class="text-center"
                            sec:authorize="hasRole('ADMIN')">

                            <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}"
                               class="btn btn-warning btn-sm me-2">

                                <i class="bi bi-pencil-square"></i>

                            </a>

                            <a th:href="@{/clientes/eliminar/{id}(id=${cliente.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Desea eliminar este cliente?')">

                                <i class="bi bi-trash-fill"></i>

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
