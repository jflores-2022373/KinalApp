<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <title>Formulario Cliente | KinalApp</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet"
        th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5 mb-5">

  <div class="row justify-content-center">

    <div class="col-md-8">

      <div class="card shadow-lg border-0 rounded-4">

        <div class="card-header bg-primary text-white p-4 rounded-top-4">

          <h2 class="m-0">

            Formulario Cliente

          </h2>

        </div>

        <div class="card-body p-4">

          <form th:action="@{/clientes/guardar}"
                th:object="${cliente}"
                method="post">

            <input type="hidden"
                   th:field="*{id}">

            <div class="row">

              <div class="col-md-6 mb-3">

                <label class="form-label fw-bold">

                  Nombre

                </label>

                <input type="text"
                       th:field="*{nombre}"
                       class="form-control"
                       placeholder="Ingrese el nombre">

                <div class="text-danger mt-1"
                     th:if="${#fields.hasErrors('nombre')}"
                     th:errors="*{nombre}">
                </div>

              </div>

              <div class="col-md-6 mb-3">

                <label class="form-label fw-bold">

                  Apellido

                </label>

                <input type="text"
                       th:field="*{apellido}"
                       class="form-control"
                       placeholder="Ingrese el apellido">

                <div class="text-danger mt-1"
                     th:if="${#fields.hasErrors('apellido')}"
                     th:errors="*{apellido}">
                </div>

              </div>

            </div>

            <div class="mb-3">

              <label class="form-label fw-bold">

                Correo Electrónico

              </label>

              <input type="email"
                     th:field="*{correo}"
                     class="form-control"
                     placeholder="correo@ejemplo.com">

              <div class="text-danger mt-1"
                   th:if="${#fields.hasErrors('correo')}"
                   th:errors="*{correo}">
              </div>

            </div>

            <div class="row">

              <div class="col-md-6 mb-3">

                <label class="form-label fw-bold">

                  Teléfono

                </label>

                <input type="text"
                       th:field="*{telefono}"
                       class="form-control"
                       placeholder="Ingrese el teléfono">

                <div class="text-danger mt-1"
                     th:if="${#fields.hasErrors('telefono')}"
                     th:errors="*{telefono}">
                </div>

              </div>

              <div class="col-md-6 mb-3">

                <label class="form-label fw-bold">

                  NIT

                </label>

                <input type="text"
                       th:field="*{nit}"
                       class="form-control"
                       placeholder="Ingrese el NIT">

              </div>

            </div>

            <div class="mb-4">

              <label class="form-label fw-bold">

                Dirección

              </label>

              <input type="text"
                     th:field="*{direccion}"
                     class="form-control"
                     placeholder="Ingrese la dirección">

            </div>

            <div class="d-flex justify-content-between">

              <a th:href="@{/clientes}"
                 class="btn btn-secondary px-4">

                Volver

              </a>

              <button type="submit"
                      class="btn btn-success px-4">

                Guardar Cliente

              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>

</body>
</html>
