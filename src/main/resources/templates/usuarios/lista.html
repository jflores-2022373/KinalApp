<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Usuarios | KinalApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5 mb-5">

    <div class="card shadow-lg border-0 rounded-4">

        <div class="card-header bg-secondary text-white p-4">

            <div class="d-flex justify-content-between align-items-center">

                <h2 class="fw-bold m-0">

                    <i class="bi bi-person-fill-gear"></i>
                    Gestión de Usuarios

                </h2>

                <a th:href="@{/usuarios/nuevo}"
                   class="btn btn-light fw-bold">

                    <i class="bi bi-plus-circle"></i>
                    Nuevo Usuario

                </a>

            </div>

        </div>

        <div class="card-body p-4">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Username</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th class="text-center">Acciones</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="usuario : ${usuarios}">

                        <td th:text="${usuario.id}"></td>

                        <td th:text="${usuario.username}"></td>

                        <td class="fw-bold"
                            th:text="${usuario.nombre}"></td>

                        <td th:text="${usuario.correo}"></td>

                        <td>

                            <span class="badge bg-primary"
                                  th:text="${usuario.rol}"></span>

                        </td>

                        <td class="text-center">

                            <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                               class="btn btn-warning btn-sm me-2">

                                <i class="bi bi-pencil-square"></i>

                            </a>

                            <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Desea eliminar este usuario?')">

                                <i class="bi bi-trash-fill"></i>

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>
