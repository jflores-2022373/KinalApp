<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Formulario Usuario | KinalApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-header bg-warning text-dark p-4 rounded-top-4">

                    <h2 class="m-0">

                        Formulario Usuario

                    </h2>

                </div>

                <div class="card-body p-4">

                    <form th:action="@{/usuarios/guardar}"
                          th:object="${usuario}"
                          method="post">

                        <input type="hidden"
                               th:field="*{id}">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-bold">

                                    Username

                                </label>

                                <input type="text"
                                       th:field="*{username}"
                                       class="form-control">

                                <div class="text-danger mt-1"
                                     th:if="${#fields.hasErrors('username')}"
                                     th:errors="*{username}">
                                </div>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-bold">

                                    Nombre Completo

                                </label>

                                <input type="text"
                                       th:field="*{nombre}"
                                       class="form-control">

                                <div class="text-danger mt-1"
                                     th:if="${#fields.hasErrors('nombre')}"
                                     th:errors="*{nombre}">
                                </div>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Correo Electrónico

                            </label>

                            <input type="email"
                                   th:field="*{correo}"
                                   class="form-control">

                            <div class="text-danger mt-1"
                                 th:if="${#fields.hasErrors('correo')}"
                                 th:errors="*{correo}">
                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Contraseña

                            </label>

                            <input type="password"
                                   th:field="*{password}"
                                   class="form-control">

                            <div class="text-danger mt-1"
                                 th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}">
                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Rol del Usuario

                            </label>

                            <select th:field="*{rol}"
                                    class="form-select">

                                <option value="ADMIN">

                                    ADMIN

                                </option>

                                <option value="USER">

                                    USER

                                </option>

                            </select>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a th:href="@{/usuarios}"
                               class="btn btn-secondary px-4">

                                Volver

                            </a>

                            <button type="submit"
                                    class="btn btn-success px-4">

                                Guardar Usuario

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
